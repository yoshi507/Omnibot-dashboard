name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - name: Build
        run: npm run build
        env:
          VITE_BASE: /Omnibot-dashboard/
          VITE_API_BASE_URL: http://78.154.103.20:13893
          VITE_DISCORD_CLIENT_ID: "1538542627882799155"
          VITE_OAUTH_REDIRECT_URI: https://yoshi507.github.io/Omnibot-dashboard/
          VITE_USE_MOCK: "false"
          VITE_DISCORD_INVITE_URL: https://discord.com/oauth2/authorize?client_id=1538542627882799155
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
